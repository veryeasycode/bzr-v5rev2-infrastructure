# Storage configuration
storage:
  dbPath: /var/lib/mongodb
# Log configuration
systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
# Network interfaces
net:
  port: 27017
  bindIp: 0.0.0.0 # Docker host-gateway address
# Operation Profiling
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100