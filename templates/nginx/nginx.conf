user www-data;
worker_processes auto;
pid /run/nginx.pid;

# The official upstream package automatically loads modules from its main path.
# We explicitly load NJS here just in case, but ensure it's not duplicated.
load_module modules/ngx_http_js_module.so;
load_module modules/ngx_http_auth_pam_module.so;

events {
  worker_connections 768;
}

http {
  # Runtime DNS for proxy_pass targets that go through a variable.
  # ipv6=off is load-bearing: cloud.* sits behind Cloudflare, which auto-generates AAAA
  # records (only Enterprise plans can turn that off). Shop networks get an IPv6 prefix via
  # SLAAC but the route is a blackhole, so any AAAA peer nginx picks stalls for the full
  # proxy_connect_timeout. See the 2026-08-01 nginx IPv6 connect-timeout postmortem.
  resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
  resolver_timeout 5s;

  # The leading fields are the classic combined layout — do not reorder them, existing log
  # parsing depends on it. The upstream fields are quoted because nginx joins them with ", "
  # when a request contacts more than one upstream, and the embedded space would shift every
  # field after them.
  log_format combined_no_query '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time uct="$upstream_connect_time" urt="$upstream_response_time" '
                      'ua="$upstream_addr" cf=$http_cf_connecting_ip';

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  
  ssl_prefer_server_ciphers on;
  
  access_log /var/log/nginx/access.log combined_no_query;
  error_log /var/log/nginx/error.log;
  
  gzip on;
  
  # Supports both the official conf.d folder and your custom sites-enabled folder
  include /etc/nginx/conf.d/*.conf;
}