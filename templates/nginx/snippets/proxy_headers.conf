# The one proxy header set. Every proxying location includes this and nothing else.
#
# The upgrade headers are unconditional on purpose: $connection_upgrade (mapped in nginx.conf)
# is empty for non-WebSocket requests, and nginx omits headers that evaluate to "", so plain
# HTTP locations are unaffected and there is no separate "ws" variant to forget to include.
#
# Host goes through $forward_host, which bzr_v5.conf defaults to $host at server level. A
# location that proxies to a different vhost overrides it with a single `set` (see
# emc_cloud.conf) instead of re-declaring the whole header set.
proxy_http_version 1.1;
proxy_set_header Host            $forward_host;
proxy_set_header X-Real-IP       $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Upgrade         $http_upgrade;
proxy_set_header Connection      $connection_upgrade;
