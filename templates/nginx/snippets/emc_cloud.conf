# Resolving through a variable forces nginx to use the http-level `resolver` (which is set to
# ipv6=off) instead of resolving the name once at config load and building an implicit upstream
# group out of every A *and* AAAA record. $request_uri reproduces the old no-trailing-slash
# behaviour: this location has no rewrite and the old proxy_pass carried no URI part.
set $cloud_upstream {{CLOUD_SERVER_NAME}};
proxy_pass https://$cloud_upstream$request_uri;
proxy_connect_timeout 5s;

proxy_set_header Host {{CLOUD_SERVER_NAME}};
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

proxy_ssl_server_name on;
proxy_ssl_name {{CLOUD_SERVER_NAME}};

# WebSocket upgrade. ws_headers.conf cannot be included here: it forces `Host $host`, which
# would send the shop's own hostname to the cloud vhost. Everything else it does is repeated
# below against the cloud upstream instead.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# socket.io pings every 25s; the 60s default would tear down an otherwise healthy tunnel.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
