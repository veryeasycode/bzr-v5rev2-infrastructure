# $forward_host does three jobs here, so the cloud hostname is templated exactly once:
#   - proxy_pass through a variable forces nginx to resolve at runtime via the http-level
#     `resolver` (ipv6=off) rather than pinning every A *and* AAAA record at config load.
#     See the 2026-08-01 nginx IPv6 connect-timeout postmortem.
#   - the Host header and SNI name the cloud vhost, not the shop's own hostname.
# $request_uri reproduces the no-trailing-slash behaviour: this location has no rewrite.
set $forward_host {{CLOUD_SERVER_NAME}};

include /etc/nginx/snippets/proxy_headers.conf;
proxy_pass https://$forward_host$request_uri;

proxy_ssl_server_name on;
proxy_ssl_name $forward_host;

proxy_connect_timeout 5s;
# socket.io pings every 25s; the 60s default would tear down an otherwise healthy tunnel.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
