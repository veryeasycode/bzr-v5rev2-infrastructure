js_import bzr_v5_jwt_decoder from /etc/nginx/njs/bzr_v5_jwt_decoder.js;
js_set $verify_jwt bzr_v5_jwt_decoder.verify;

# Infrastructure Services
upstream docker_engine_api {
    server unix:/var/run/docker.sock;
}

# Core Services
upstream bzr_v5_functions {
    server 127.0.0.1:{{SERVICE_FUNCTIONS_PORT}};
}
upstream bzr_v5_mongostream {
    server 127.0.0.1:{{SERVICE_MONGOSTREAM_PORT}};
}
upstream bzr_v5_authenticator {
    server 127.0.0.1:{{SERVICE_AUTHENTICATOR_PORT}};
}
upstream bzr_v5_backoffice {
    server 127.0.0.1:{{SERVICE_BACKOFFICE_PORT}};
}
upstream bzr_v5_edc_api {
    hash $remote_addr consistent;
    server 127.0.0.1:{{SERVICE_EDC_API_PORT}};
}
upstream bzr_v5_edc_web {
    hash $remote_addr consistent;
    server 127.0.0.1:{{SERVICE_EDC_WEB_PORT}};
}
upstream bzr_v5_backoffice2_api {
    server 127.0.0.1:{{SERVICE_BACKOFFICE2_API_PORT}};
}
upstream bzr_v5_backoffice2_web {
    server 127.0.0.1:{{SERVICE_BACKOFFICE2_WEB_PORT}};
}
upstream bzr_v5_line_menu_bot {
    hash $remote_addr consistent;
    server 127.0.0.1:{{SERVICE_LINE_MENU_BOT_PORT}};
}

# Cloud Services
upstream bzr_v5_line_menu_api {
    hash $remote_addr consistent;
    server 127.0.0.1:{{SERVICE_LINE_MENU_API_PORT}};
}
upstream bzr_v5_line_menu_web {
    hash $remote_addr consistent;
    server 127.0.0.1:{{SERVICE_LINE_MENU_WEB_PORT}};
}
upstream bzr_v5_reservation_api {
    server 127.0.0.1:{{SERVICE_RESERVATION_API_PORT}};
}
upstream bzr_v5_reservation_web_backoffice {
    server 127.0.0.1:{{SERVICE_RESERVATION_WEB_BACKOFFICE_PORT}};
}
upstream bzr_v5_reservation_web_form {
    server 127.0.0.1:{{SERVICE_RESERVATION_WEB_FORM_PORT}};
}
upstream bzr_v5_message_gateway {
    server 127.0.0.1:{{SERVICE_MESSAGE_GATEWAY_PORT}};
}
upstream bzr_v5_line_menu_web_lite {
    hash $remote_addr consistent;
    server 127.0.0.1:{{SERVICE_LINE_MENU_WEB_LITE_PORT}};
}
upstream bzr_v5_line_delivery_web {
    hash $remote_addr consistent;
    server 127.0.0.1:{{SERVICE_LINE_DELIVERY_WEB_PORT}};
}
upstream bzr_v5_line_bingo_web {
    hash $remote_addr consistent;
    server 127.0.0.1:{{SERVICE_LINE_BINGO_WEB_PORT}};
}

server {
    server_name ngum-platform.local;
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    include /etc/nginx/snippets/cert_support.conf;
    include /etc/nginx/snippets/cors_support.conf;

    # Core Service routes
    location / {
        proxy_pass http://bzr_v5_backoffice;
    }
    location /api/ {
        set $user $verify_jwt;
        proxy_set_header x-user $user;
        proxy_pass http://bzr_v5_functions;
    }
    location /socket.io {
        include /etc/nginx/snippets/ws_headers.conf;
        proxy_pass http://bzr_v5_mongostream;
    }
    location /v4 {
        location /v4/auth/ping-jwt {
            set $user $verify_jwt;
            proxy_set_header x-user $user;
            if ($user != '0') {
                proxy_pass http://bzr_v5_authenticator;
            }
        }
        location /v4/auth {
            proxy_pass http://bzr_v5_authenticator;
        }
    }
    location /storage {
        alias /var/www/bzr_v5/static;
        sendfile on;
        gzip_static on;
        try_files $uri $uri/ =404;
    }
    location /log {
        alias /var/www/bzr_v5/log;
        sendfile on;
        gzip_static on;
        try_files $uri $uri/ =404;
    }
    location /edc {
        proxy_pass http://bzr_v5_edc_api;
    }
    location /edc/app {
        proxy_pass http://bzr_v5_edc_web;
    }
    location /edc/socket.io {
        include /etc/nginx/snippets/ws_headers.conf;
        proxy_pass http://bzr_v5_edc_api;
    }
    location /edc/version {
        include /etc/nginx/snippets/enable_pam.conf;
        proxy_hide_header WWW-Authenticate;
        error_page 401 = @401;
        proxy_pass http://bzr_v5_edc_api/edc/version;
    }
    location /bo/ {
        proxy_pass http://bzr_v5_backoffice2_web/;
    }
    location /bo/api/ {
        proxy_pass http://bzr_v5_backoffice2_api/;
    }

    # Extension Service routes
    location /line-menu-bot/ {
        include /etc/nginx/snippets/ws_headers.conf;
        proxy_pass http://bzr_v5_line_menu_bot;
    }

    # Cloud Service routes
    location /emc {
        proxy_pass http://bzr_v5_line_menu_web;
    }
    location /emc-lite {
        proxy_pass http://bzr_v5_line_menu_web_lite;
    }
    location /emc-delivery {
        proxy_pass http://bzr_v5_line_delivery_web;
    }
    location /bingo {
        proxy_pass http://bzr_v5_line_bingo_web;
    }
    location /emc/api/ {
        # emc_local.conf on the cloud server itself, emc_cloud.conf elsewhere;
        include /etc/nginx/snippets/{{EMC_API_SNIPPET}};
    }
    location /emc/storage {
        alias /var/www/bzr_v5/emc/storage;
        sendfile on;
        gzip_static on;
        try_files $uri $uri/ =404;
    }
    location /reservation/ {
        proxy_pass http://bzr_v5_reservation_web_form/;
    }
    location /reservation/api/ {
        proxy_pass http://bzr_v5_reservation_api/;
    }
    location /reservation/backoffice/ {
        proxy_pass http://bzr_v5_reservation_web_backoffice/;
    }
    location /message-gateway/ {
        include /etc/nginx/snippets/ws_headers.conf;
        proxy_pass http://bzr_v5_message_gateway/;
    }
    # Infrastructure Services
    location /auth/admin {
        include /etc/nginx/snippets/enable_pam.conf;
        proxy_hide_header WWW-Authenticate;
        error_page 401 = @401;
        try_files DUMMY @return200;
    }
    location /docker/ {
        include /etc/nginx/snippets/enable_pam.conf;
        proxy_pass http://docker_engine_api/;
    }
    # Defaults
    location @return200 {
        return 200 'hello';
    }
    location @401 {
        proxy_hide_header WWW-Authenticate;
        # Preferably, only set those available in $http_www_authenticate
        add_header WWW-Authenticate 'Basic realm="TM1"' always;
        add_header WWW-Authenticate 'Negotiate' always;
        add_header X-isvalid false;
        return 404;
    }
}